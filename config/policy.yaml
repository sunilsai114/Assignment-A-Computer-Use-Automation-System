# Default-deny: anything not listed here is blocked.
allowed_hosts: ["127.0.0.1", "localhost"]
allowed_paths: ["/", "/heritage/*", "/nova/*", "/static/*"]   # /_admin/* is deliberately absent
allowed_actions: [navigate, click, type, select, read, wait]

# A step is irreversible if declared so OR its intent/control text contains a marker (defence against
# a mislabelled discovery run). Irreversible steps never run unattended.
irreversible_markers: ["close account", "submit transfer", "confirm transfer", "delete",
                       "submit application", "create account"]
irreversible_policy: require_approval   # or: block

app_error_markers: ["unexpected error occurred", "something went wrong", "internal server error"]

redact:
  ssn: '\b\d{3}-\d{2}-\d{4}\b'
  email: '[\w.+-]+@[\w-]+\.[\w.]+'
  phone: '\b\(?\d{3}\)?[-. ]?\d{3}[-. ]\d{4}\b'
  account_number: '\b\d{8,17}\b'
  secret_field_names: [password, passwd, pin, token, api_key, passcode]

limits:
  max_steps: 25
  run_timeout_s: 120
  action_timeout_ms: 8000
  max_interstitials: 3
  max_reauths: 2   # one for the initial sign-in of a cold session + one for a mid-run expiry
